backend:
  name: github
  repo: social-bhaskarprabha/social-bhaskarprabha.github.io
  branch: master

publish_mode: editorial_workflow

media_folder: "images/uploads" # Images folder
public_folder: "/images/uploads" # Publicly accessible URL path

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}